  services:
    postgres:
      image: postgres:16
      container_name: catalogo_productos_db
      restart: unless-stopped
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

        POSTGRES_DB: catalogo_productos
      ports:
        - "5433:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: